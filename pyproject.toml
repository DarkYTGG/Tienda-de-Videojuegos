[project]
name = "pixelvault-store"
version = "1.0.0"
description = "PixelVault — Tienda Digital de Videojuegos inspirada en Steam e itch.io (Python, Flet, POO, Arquitectura en Capas)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet>=1.0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
