{% extends "base.html" %}

{% block title %}Error del Servidor — PixelVault{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="p-5 rounded-4 my-4" style="background: var(--bg-surface); border: 1px solid var(--border-subtle); max-width: 650px; margin: 0 auto;">
    <div class="brand-icon-box mx-auto mb-3" style="width: 70px; height: 70px; background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4);">
      <i class="bi bi-gear-wide-connected text-danger fs-2"></i>
    </div>
    <h1 class="display-4 fw-extrabold text-white mb-2 font-monospace">500</h1>
    <h3 class="text-white fw-bold mb-3">Error Interno del Servidor</h3>
    <p class="text-secondary small mb-4">
      Ocurrió un error inesperado al procesar la solicitud en el backend.
    </p>
    <a href="{{ url_for('store.index') }}" class="btn btn-primary-pixel">
      <i class="bi bi-house-door me-1"></i> Regresar a la Tienda
    </a>
  </div>
</div>
{% endblock %}
